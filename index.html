<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ediths Bücher</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f5f0e8;
  --bg2: #ede8de;
  --bg3: rgba(220,210,190,0.95);
  --gold: #8a6a20;
  --gold2: #6b4f10;
  --gold3: #7a5515;
  --text: #1a1208;
  --muted: #5a6670;
  --card: rgba(255,252,246,0.97);
  --border: rgba(100,80,30,0.18);
  --radius: 12px;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --serif: Georgia, 'Times New Roman', serif;
}
body { background: #f0ece3; color: var(--text); font-family: var(--sans); min-height: 100vh; font-size: 15px; }
.header { background: rgba(250,246,238,0.97); padding: 22px 16px 14px; text-align: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
.header-title { font-family: var(--serif); font-size: 26px; color: var(--gold2); margin-bottom: 2px; }
.header-sub { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
.search-wrap { position: relative; max-width: 400px; margin: 0 auto; }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search-input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 24px; padding: 9px 14px 9px 36px; color: var(--text); font-size: 14px; outline: none; -webkit-appearance: none; }
.nav { display: flex; background: rgba(248,244,236,0.97); border-bottom: 1px solid var(--border); position: sticky; top: 130px; z-index: 99; overflow-x: auto; }
.nav::-webkit-scrollbar { display: none; }
.nav-btn { flex: 1; min-width: 75px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); padding: 11px 6px; font-size: 12px; cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
.nav-btn.active { color: var(--gold2); border-bottom-color: var(--gold); }
.main { padding: 14px; max-width: 600px; margin: 0 auto; }
.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
.stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 8px; text-align: center; }
.stat-num { font-family: var(--serif); font-size: 24px; color: var(--gold2); font-weight: bold; }
.stat-label { font-size: 10px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.4px; }
.filter-pills { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; }
.filter-pills::-webkit-scrollbar { display: none; }
.pill { background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; padding: 5px 13px; font-size: 11px; color: var(--muted); cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
.pill.active { background: var(--gold3); color: #fff; border-color: var(--gold3); }
.author-group { margin-bottom: 20px; }
.author-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.author-icon { width: 34px; height: 34px; border-radius: 50%; background: var(--bg3); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--gold); flex-shrink: 0; font-family: var(--serif); }
.author-name { font-size: 15px; font-weight: 600; color: var(--gold2); flex: 1; }
.author-count { font-size: 11px; color: var(--muted); background: var(--bg3); padding: 2px 7px; border-radius: 10px; border: 1px solid var(--border); }
.series-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.7px; color: var(--gold3); margin: 8px 0 5px 2px; }
.books-grid { display: flex; flex-direction: column; gap: 5px; }
.book-card { background: var(--card); border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
.book-num { width: 26px; height: 26px; background: var(--bg3); border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--gold); font-weight: 600; flex-shrink: 0; }
.book-title-text { font-size: 13px; color: var(--text); flex: 1; }
.book-rating { font-size: 11px; color: var(--gold); }
.book-note { font-size: 11px; color: var(--muted); margin-top: 2px; }
.book-fav { background: none; border: none; cursor: pointer; font-size: 16px; color: var(--muted); padding: 4px; -webkit-tap-highlight-color: transparent; }
.book-fav.active { color: var(--gold); }
.gbadge { display: inline-block; font-size: 9px; padding: 2px 6px; border-radius: 8px; margin-right: 3px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.2px; }
.g-krimi { background: #fde8e8; color: #a03030; border: 1px solid #f0aaaa; }
.g-thriller { background: #e8e8fd; color: #3030a0; border: 1px solid #aaaaee; }
.g-nordic { background: #e0f5f2; color: #1a7060; border: 1px solid #80ccbb; }
.g-hist { background: #f5ede0; color: #7a4a10; border: 1px solid #d4aa70; }
.g-other { background: var(--bg3); color: var(--muted); border: 1px solid var(--border); }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }
.form-section { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 18px; }
.form-section h3 { font-family: var(--serif); font-size: 17px; color: var(--gold2); margin-bottom: 14px; }
.form-group { margin-bottom: 12px; }
.form-label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
.form-input, .form-select, .form-textarea { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 7px; padding: 9px 11px; color: var(--text); font-size: 14px; outline: none; font-family: var(--sans); -webkit-appearance: none; }
.form-textarea { resize: vertical; min-height: 65px; }
.btn-primary { width: 100%; background: var(--gold3); border: none; border-radius: 9px; padding: 12px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; margin-top: 4px; }
.tips-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
.tips-card h4 { font-family: var(--serif); font-size: 15px; color: var(--gold2); margin-bottom: 10px; }
.tip-item { display: flex; gap: 9px; align-items: flex-start; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.tip-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.tip-emoji { font-size: 18px; flex-shrink: 0; }
.tip-text { font-size: 13px; color: var(--text); line-height: 1.5; }
.tip-text strong { color: var(--gold2); }
.profile-ring { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
.profile-tag { background: var(--bg3); border: 1px solid var(--border); border-radius: 18px; padding: 4px 10px; font-size: 12px; color: var(--text); }
.profile-tag .pct { color: var(--gold); font-weight: 600; margin-left: 3px; }
.star-row { display: flex; gap: 5px; }
.star-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--muted); padding: 2px; -webkit-tap-highlight-color: transparent; }
.star-btn.lit { color: var(--gold); }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--gold3); color: #fff; padding: 9px 18px; border-radius: 18px; font-size: 13px; font-weight: 600; transition: transform 0.3s; z-index: 999; pointer-events: none; white-space: nowrap; }
.toast.show { transform: translateX(-50%) translateY(0); }
.divider { display: flex; align-items: center; gap: 8px; margin: 16px 0 12px; }
.divider span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.7px; white-space: nowrap; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
</style>
</head>

<div class="header">
  <div class="header-title">&#128218; Ediths Bücher</div>
  <div class="header-sub">Meine persönliche Bibliothek</div>
  <div class="search-wrap">
    <span class="search-icon">&#128269;</span>

  </div>
</div>

<nav class="nav">
  <button class="nav-btn active" id="btn-bibliothek" onclick="showTab('bibliothek')">&#128218; Bibliothek</button>
  <button class="nav-btn" id="btn-hinzufuegen" onclick="showTab('hinzufuegen')">&#43; Hinzufügen</button>
  <button class="nav-btn" id="btn-favoriten" onclick="showTab('favoriten')">&#11088; Favoriten</button>
  <button class="nav-btn" id="btn-tipps" onclick="showTab('tipps')">&#128161; Tipps</button>
</nav>

<div class="main">

  <div id="tab-bibliothek">
    <div class="stats-row" id="statsRow"></div>
    <div class="filter-pills" id="filterPills"></div>
    <div id="bookList"></div>
  </div>

  <div id="tab-hinzufuegen" style="display:none">
    <div class="form-section">
      <h3>Neues Buch eintragen</h3>
      <div class="form-group">
        <label class="form-label">Titel</label>
        <input class="form-input" type="text" id="newTitle" placeholder="Buchtitel ...">
      </div>
      <div class="form-group">
        <label class="form-label">Autor</label>
        <input class="form-input" type="text" id="newAuthor" placeholder="Autorenname ...">
      </div>
      <div class="form-group">
        <label class="form-label">Reihe (optional)</label>
        <input class="form-input" type="text" id="newSeries" placeholder="z.B. Kendra Elliott – Callahan &amp; McLane">
      </div>
      <div class="form-group">
        <label class="form-label">Band-Nummer</label>
        <input class="form-input" type="number" id="newBand" placeholder="z.B. 1" min="1">
      </div>
      <div class="form-group">
        <label class="form-label">Genre</label>
        <select class="form-select" id="newGenre">
          <option value="Krimi">Krimi</option>
          <option value="Thriller">Thriller</option>
          <option value="Nordischer Krimi">Nordischer Krimi</option>
          <option value="Historisch">Historischer Krimi</option>
          <option value="Sonstiges">Sonstiges</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Bewertung</label>
        <div class="star-row">
          <button class="star-btn" onclick="setRating(1)">&#9733;</button>
          <button class="star-btn" onclick="setRating(2)">&#9733;</button>
          <button class="star-btn" onclick="setRating(3)">&#9733;</button>
          <button class="star-btn" onclick="setRating(4)">&#9733;</button>
          <button class="star-btn" onclick="setRating(5)">&#9733;</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Notiz (optional)</label>
        <textarea class="form-textarea" id="newNote" placeholder="Meine Gedanken zum Buch ..."></textarea>
      </div>
      <button class="btn-primary" onclick="addBook()">&#128218; Buch hinzufügen</button>
    </div>
  </div>

  <div id="tab-favoriten" style="display:none">
    <div class="divider"><span>Meine Lieblinge &#11088;</span></div>
    <div id="favList"></div>
  </div>

  <div id="tab-tipps" style="display:none">
    <div class="tips-card">
      <h4>&#128202; Dein Leserprofil</h4>
      <div class="profile-ring" id="profileRing"></div>
      <div style="font-size:12px;color:var(--muted)">Basierend auf <span id="profileTotal">0</span> Büchern.</div>
    </div>
    <div class="tips-card">
      <h4>&#128161; Empfehlungen für dich</h4>
      <div id="tipsList"></div>
    </div>
    <div class="tips-card">
      <h4>&#128507; Deine Lesereise</h4>
      <div id="mapTips" style="font-size:13px;color:var(--text);line-height:1.7"></div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

var books = [];
var currentRating = 0;
var activeFilter = "Alle";

function loadBooks() {
  books = BOOKS.slice();
  try {
    var s = localStorage.getItem("edith_books");
    if (s) {
      var parsed = JSON.parse(s);
      var ids = {};
      for (var i = 0; i < parsed.length; i++) ids[parsed[i].id] = true;
      books = parsed.slice();
      for (var j = 0; j < BOOKS.length; j++) {
        if (!ids[BOOKS[j].id]) books.push(BOOKS[j]);
      }
    }
  } catch(e) {}
}

function saveBooks() {
  try { localStorage.setItem("edith_books", JSON.stringify(books)); } catch(e) {}
}

function getNextId() {
  var max = 0;
  for (var i = 0; i < books.length; i++) if (books[i].id > max) max = books[i].id;
  return max + 1;
}

function showTab(tab) {
  var tabs = ["bibliothek","hinzufuegen","favoriten","tipps"];
  for (var i = 0; i < tabs.length; i++) {
    document.getElementById("tab-" + tabs[i]).style.display = tabs[i] === tab ? "" : "none";
    var btn = document.getElementById("btn-" + tabs[i]);
    if (btn) btn.className = "nav-btn" + (tabs[i] === tab ? " active" : "");
  }
  if (tab === "bibliothek") renderBibliothek();
  if (tab === "favoriten") renderFavoriten();
  if (tab === "tipps") renderTipps();
}

function genreClass(g) {
  if (g === "Krimi") return "gbadge g-krimi";
  if (g === "Thriller") return "gbadge g-thriller";
  if (g === "Nordischer Krimi") return "gbadge g-nordic";
  if (g === "Historisch") return "gbadge g-hist";
  return "gbadge g-other";
}

function stars(n) {
  var s = "";
  for (var i = 0; i < n; i++) s += "\u2605";
  return s;
}

function renderBibliothek() {
  var q = (document.getElementById("searchInput").value || "").toLowerCase();
  var filtered = [];
  for (var i = 0; i < books.length; i++) {
    var b = books[i];
    if (activeFilter !== "Alle" && b.genre !== activeFilter) continue;
    if (q && b.title.toLowerCase().indexOf(q) < 0 && b.author.toLowerCase().indexOf(q) < 0 && (b.series || "").toLowerCase().indexOf(q) < 0) continue;
    filtered.push(b);
  }

  var favCount = 0;
  for (var i = 0; i < books.length; i++) if (books[i].fav) favCount++;
  var authors = {};
  for (var i = 0; i < books.length; i++) authors[books[i].author] = true;
  var authorCount = Object.keys(authors).length;

  document.getElementById("statsRow").innerHTML =
    '<div class="stat-card"><div class="stat-num">' + books.length + '</div><div class="stat-label">B\u00fccher</div></div>' +
    '<div class="stat-card"><div class="stat-num">' + authorCount + '</div><div class="stat-label">Autoren</div></div>' +
    '<div class="stat-card"><div class="stat-num">' + favCount + '</div><div class="stat-label">Favoriten \u2b50</div></div>';

  var genres = ["Alle","Krimi","Thriller","Nordischer Krimi","Historisch","Sonstiges"];
  var pillsHtml = "";
  for (var i = 0; i < genres.length; i++) {
    pillsHtml += '<button class="pill' + (activeFilter === genres[i] ? " active" : "") + '" onclick="setFilter(\'' + genres[i] + '\')">' + genres[i] + '</button>';
  }
  document.getElementById("filterPills").innerHTML = pillsHtml;

  if (filtered.length === 0) {
    document.getElementById("bookList").innerHTML = '<div class="empty">Keine B\u00fccher gefunden.</div>';
    return;
  }

  var authorMap = {};
  for (var i = 0; i < filtered.length; i++) {
    var b = filtered[i];
    if (!authorMap[b.author]) authorMap[b.author] = [];
    authorMap[b.author].push(b);
  }

  var html = "";
  var authorList = Object.keys(authorMap);
  for (var ai = 0; ai < authorList.length; ai++) {
    var author = authorList[ai];
    var ab = authorMap[author];
    var initials = author.split(" ").map(function(w) { return w[0] || ""; }).slice(0,2).join("").toUpperCase();

    var seriesMap = {};
    for (var i = 0; i < ab.length; i++) {
      var key = ab[i].series || "\u2014";
      if (!seriesMap[key]) seriesMap[key] = [];
      seriesMap[key].push(ab[i]);
    }

    var booksHtml = "";
    var seriesKeys = Object.keys(seriesMap);
    for (var si = 0; si < seriesKeys.length; si++) {
      var skey = seriesKeys[si];
      var sbooks = seriesMap[skey];
      sbooks.sort(function(a,b) { return a.band - b.band; });
      if (skey !== "\u2014") booksHtml += '<div class="series-title">' + skey + '</div>';
      booksHtml += '<div class="books-grid">';
      for (var bi = 0; bi < sbooks.length; bi++) {
        var bk = sbooks[bi];
        var favClass = "book-fav" + (bk.fav ? " active" : "");
        booksHtml += '<div class="book-card">' +
          '<div class="book-num">' + (bk.band || "\u2014") + '</div>' +
          '<div style="flex:1">' +
            '<div class="book-title-text">' + bk.title + '</div>' +
            (bk.rating ? '<div class="book-rating">' + stars(bk.rating) + '</div>' : '') +
            (bk.note ? '<div class="book-note">' + bk.note + '</div>' : '') +
          '</div>' +
          '<span class="' + genreClass(bk.genre) + '">' + bk.genre + '</span>' +
          '<button class="' + favClass + '" onclick="toggleFav(' + bk.id + ',event)">\u2605</button>' +
        '</div>';
      }
      booksHtml += '</div>';
    }

    html += '<div class="author-group">' +
      '<div class="author-header">' +
        '<div class="author-icon">' + initials + '</div>' +
        '<div class="author-name">' + author + '</div>' +
        '<span class="author-count">' + ab.length + ' B\u00fccher</span>' +
      '</div>' + booksHtml + '</div>';
  }
  document.getElementById("bookList").innerHTML = html;
}

function setFilter(g) { activeFilter = g; renderBibliothek(); }
function applyFilters() { renderBibliothek(); }

function toggleFav(id, e) {
  if (e) e.stopPropagation();
  for (var i = 0; i < books.length; i++) {
    if (books[i].id === id) {
      books[i].fav = !books[i].fav;
      saveBooks();
      showToast(books[i].fav ? "\u2b50 Als Favorit markiert" : "\u2606 Favorit entfernt");
      renderBibliothek();
      return;
    }
  }
}

function renderFavoriten() {
  var favs = [];
  for (var i = 0; i < books.length; i++) if (books[i].fav) favs.push(books[i]);
  if (!favs.length) {
    document.getElementById("favList").innerHTML = '<div class="empty">Noch keine Favoriten.<br>Markiere B\u00fccher mit \u2605 in der Bibliothek.</div>';
    return;
  }
  var html = "";
  for (var i = 0; i < favs.length; i++) {
    var b = favs[i];
    html += '<div class="book-card" style="margin-bottom:7px">' +
      '<div class="book-num">' + (b.band || "\u2014") + '</div>' +
      '<div style="flex:1">' +
        '<div class="book-title-text">' + b.title + '</div>' +
        '<div style="font-size:11px;color:var(--muted)">' + b.author + (b.series ? " \u00b7 " + b.series : "") + '</div>' +
        (b.rating ? '<div class="book-rating">' + stars(b.rating) + '</div>' : '') +
      '</div>' +
      '<span class="' + genreClass(b.genre) + '">' + b.genre + '</span>' +
    '</div>';
  }
  document.getElementById("favList").innerHTML = html;
}

function renderTipps() {
  var genreCounts = {};
  for (var i = 0; i < books.length; i++) {
    var g = books[i].genre;
    genreCounts[g] = (genreCounts[g] || 0) + 1;
  }
  var total = books.length;
  document.getElementById("profileTotal").textContent = total;

  var genres = Object.keys(genreCounts).sort(function(a,b) { return genreCounts[b] - genreCounts[a]; });
  var ringHtml = "";
  for (var i = 0; i < genres.length; i++) {
    var pct = Math.round(genreCounts[genres[i]] / total * 100);
    ringHtml += '<div class="profile-tag">' + genres[i] + '<span class="pct">' + pct + '%</span></div>';
  }
  document.getElementById("profileRing").innerHTML = ringHtml;

  var authorCounts = {};
  for (var i = 0; i < books.length; i++) {
    var a = books[i].author;
    authorCounts[a] = (authorCounts[a] || 0) + 1;
  }
  var topAuthors = Object.keys(authorCounts).sort(function(a,b) { return authorCounts[b] - authorCounts[a]; });

  var nordic = Math.round((genreCounts["Nordischer Krimi"] || 0) / total * 100);
  var tipsHtml =
    '<div class="tip-item"><span class="tip-emoji">\ud83d\udcd6</span><div class="tip-text"><strong>Deine Nr. 1:</strong> ' + (topAuthors[0] ? topAuthors[0] + " (" + authorCounts[topAuthors[0]] + " B\u00fccher)" : "\u2013") + '. Schau, was dieser Autor noch geschrieben hat!</div></div>' +
    '<div class="tip-item"><span class="tip-emoji">\ud83c\udf0d</span><div class="tip-text"><strong>Nordischer Krimi</strong> macht ' + nordic + '% deiner Bibliothek aus. Tipp: <em>Jo Nesb\u00f8 (Harry Hole), Jussi Adler-Olsen (Sonderdezernat Q)</em>.</div></div>' +
    '<div class="tip-item"><span class="tip-emoji">\ud83c\udf1f</span><div class="tip-text">Du liebst <strong>Serien & Reihen</strong>. Tipp: <em>Ann Cleeves (Vera Stanhope / Shetland)</em> \u2013 atmosph\u00e4risch, viele B\u00e4nde.</div></div>' +
    '<div class="tip-item"><span class="tip-emoji">\ud83d\udcda</span><div class="tip-text">Neue Entdeckung: <strong>Denzil Meyrick (DCI Daley)</strong> \u2013 schottisch, d\u00fcster, fesselnd.</div></div>';
  document.getElementById("tipsList").innerHTML = tipsHtml;

  document.getElementById("mapTips").innerHTML =
    "\ud83c\uddf8\ud83c\uddea <strong>Schweden:</strong> Cilla B\u00f6rjlind, Samuel Bj\u00f6rk, Ben Tomasson, Camilla L\u00e4ckberg<br>" +
    "\ud83c\uddf3\ud83c\uddf4 <strong>Norwegen:</strong> Ingar Johnrud<br>" +
    "\ud83c\udde9\ud83c\uddf0 <strong>D\u00e4nemark:</strong> Jens Henrik Jensen, Michael Jensen<br>" +
    "\ud83c\udde9\ud83c\uddea <strong>Deutschland:</strong> Elias Haller, Andreas Gruber, Andreas Winkelmann<br>" +
    "\ud83c\uddec\ud83c\udde7 <strong>Gro\u00dfbritannien:</strong> JM Dalgliesh, M.S. Morris, Helen Phifer, Mark Dawson<br>" +
    "\ud83c\uddfa\ud83c\uddf8 <strong>USA:</strong> Kendra Elliott, Melinda Leigh, Lisa Regan, Robert Dugoni<br>" +
    "\ud83c\uddeb\ud83c\uddf7 <strong>Frankreich:</strong> Christophe Villain";
}

function setRating(v) {
  currentRating = v;
  var btns = document.querySelectorAll(".star-btn");
  for (var i = 0; i < btns.length; i++) {
    btns[i].className = "star-btn" + (i < v ? " lit" : "");
  }
}

function addBook() {
  var title = document.getElementById("newTitle").value.trim();
  var author = document.getElementById("newAuthor").value.trim();
  if (!title || !author) { showToast("\u26a0\ufe0f Bitte Titel und Autor eingeben"); return; }
  var newBook = {
    id: getNextId(),
    author: author,
    series: document.getElementById("newSeries").value.trim(),
    band: parseInt(document.getElementById("newBand").value) || 1,
    title: title,
    genre: document.getElementById("newGenre").value,
    fav: false,
    rating: currentRating,
    note: document.getElementById("newNote").value.trim()
  };
  books.push(newBook);
  saveBooks();
  document.getElementById("newTitle").value = "";
  document.getElementById("newAuthor").value = "";
  document.getElementById("newSeries").value = "";
  document.getElementById("newBand").value = "";
  document.getElementById("newNote").value = "";
  currentRating = 0;
  setRating(0);
  showToast("\ud83d\udcda Buch hinzugef\u00fcgt!");
}

function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show";
  setTimeout(function() { t.className = "toast"; }, 2200);
}

loadBooks();
renderBibliothek();
</script>
</body>
</html>
